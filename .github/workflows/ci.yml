name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The pinned numerical stack (numpy 2.5.x) requires Python
          # 3.12 or newer, so CI runs the machine-of-record version.
          python-version: "3.12"
      - name: Install the pinned stack
        run: pip install -r requirements.txt
      - name: Unit tests (synthetic data only; CI never fetches the corpus)
        run: pytest -q
      - name: Byte-compile all sources
        run: python -m py_compile src/*.py scripts/*.py
