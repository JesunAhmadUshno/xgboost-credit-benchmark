name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 3.12 is the machine-of-record stack (DECISIONS.md D4).
          - python-version: "3.12"
            requirements: requirements.txt
          # numpy 2.5.x needs 3.12, so 3.11 uses a CI-only pin set (D6).
          - python-version: "3.11"
            requirements: requirements-py311.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned stack
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Unit and layout tests (synthetic data only; CI never fetches the corpus)
        run: python -m pytest -q
      - name: Byte-compile all sources
        run: python -m py_compile src/*.py scripts/*.py
      - name: Results regenerate unchanged from the evidence
        run: python scripts/make_results.py && git diff --exit-code RESULTS.md results/verdicts.json
