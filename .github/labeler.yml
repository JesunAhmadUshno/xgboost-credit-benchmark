code:
  - changed-files:
      - any-glob-to-any-file: ["src/**", "scripts/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["README.md", "CHANGELOG.md"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
